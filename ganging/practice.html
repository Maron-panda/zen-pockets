<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — Kingdom of Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ganging/css_pretty.css">
</head>
<body>
<div class="app">
  <div class="topbar"><div class="wordmark">Kingdom of Tables</div></div>

  <div id="picker-view">
    <div class="page-title">Practice</div>
    <div class="page-sub">Choose a table to drill. (1× includes 0.)</div>
    <div class="orb-grid" id="orb-grid"></div>
  </div>

  <div id="session-view" style="display:none;">
    <div class="page-title" id="session-title">Table</div>
    <div class="session-card">
      <div class="session-progress" id="progress-text"></div>
      <div class="problem-text" id="problem-text"></div>
      <form id="answer-form">
        <input type="number" inputmode="numeric" class="answer-input" id="answer-input" placeholder="?" autocomplete="off">
        <button type="submit" class="btn btn-primary">Check</button>
      </form>
    </div>
  </div>

  <div id="result-view" style="display:none;">
    <div class="result-card">
      <div class="page-sub" style="padding:0;">Nice work!</div>
      <div class="result-score" id="result-score"></div>
      <div class="result-stats" id="result-stats"></div>
      <div id="new-badges"></div>
      <button class="btn btn-primary" id="practice-again-btn">Pick another table</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="ganging/practice.html" class="nav-item active"><span class="icon">🧮</span>Practice</a>
    <a href="ganging/battle.html" class="nav-item"><span class="icon">⚡</span>Battle</a>
    <a href="ganging/leaderboard.html" class="nav-item"><span class="icon">🏆</span>Palace</a>
    <a href="ganging/profile.html" class="nav-item"><span class="icon">⭐</span>Portal</a>
  </nav>
</div>
<script src="ganging/js/api.js"></script>
<script src="ganging/js/session.js"></script>
<script src="ganging/js/achievements.js"></script>
<script src="ganging/js/practice.js"></script>
</body>
</html>
